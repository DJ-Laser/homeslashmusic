[workspace]
resolver = "3"
members = [
  "crates/hsm-ipc",
  "crates/hsm-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hsm-ipc = { path = "./crates/hsm-ipc" }

rand = "0.9.2"
paste = "1.0.15"
dashmap = "6.1.0"
arc-swap = "1.9.5"
float-cmp = "0.10.0"
thiserror = "2.0.12"
git-version = "0.3.9"
uuid = { version = "1.29.2", features = ["serde"] }
slotmap = { version = "1.1.1", features = ["serde"] }
rustix = { version = "1.0.8", features = ["process"] }

log = "0.4.35"
env_logger = "0.11.11"

serde_json = "1.0.140"
serde = { version = "1.0.221", features = ["derive"] }

smol = "2.0.2"
async-signal = "0.2.14"
async-oneshot = "0.5.9"
async-broadcast = "0.7.2"
futures-concurrency = "7.6.3"

lofty = { version = "0.25.5", features = ["serde"] }
symphonia = { version = "0.5.4", features = ["mp3", "isomp4", "aac"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia"] }

governor = "0.8"
urlencoding = "2.1.3"
mpris-server = "0.11.0"
musicbrainz_rs = { version = "0.14.0", features = ["async", "rustls"] }

clap = { version = "4.5.41", features = ["derive"] }
clap_complete = "4.5.48"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
